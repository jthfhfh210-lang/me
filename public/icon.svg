<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#090706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background with rounded corners for standalone, full for maskable -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Inner Decorative Islamic Arch Border -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,6" opacity="0.4" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" />

  <!-- Dome and Shrine silhouette -->
  <g transform="translate(256, 260) scale(0.95)">
    <!-- Central Holy Golden Dome -->
    <path d="M 0,-150 C -40,-110 -85,-50 -85,15 L 85,15 C 85,-50 40,-110 0,-150 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- Crescent & Finial on Dome Top -->
    <path d="M 0,-150 L 0,-190" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="-195" r="7" fill="url(#goldGrad)" />
    <!-- Crescent Moon -->
    <path d="M -8,-220 A 18 18 0 1 0 18,-205 A 14 14 0 1 1 -8,-220 Z" fill="url(#goldGrad)" />

    <!-- Shrine Base Arch -->
    <path d="M -110,15 L 110,15 L 110,85 L -110,85 Z" fill="#292524" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Arch Doorway with Emerald Glow -->
    <path d="M -36,85 L -36,45 C -36,25 36,25 36,45 L 36,85 Z" fill="url(#emeraldGrad)" opacity="0.9" />

    <!-- Left Minaret -->
    <g transform="translate(-135, -20)">
      <rect x="-12" y="-90" width="24" height="175" rx="3" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="2.5" />
      <path d="M -16,-90 L 16,-90 L 12,-115 L -12,-115 Z" fill="url(#goldGrad)" />
      <path d="M 0,-115 L 0,-140" stroke="url(#goldGrad)" stroke-width="3" />
      <circle cx="0" cy="-143" r="4" fill="url(#goldGrad)" />
      <!-- Balcony -->
      <rect x="-18" y="-45" width="36" height="8" rx="2" fill="url(#goldGrad)" />
    </g>

    <!-- Right Minaret -->
    <g transform="translate(135, -20)">
      <rect x="-12" y="-90" width="24" height="175" rx="3" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="2.5" />
      <path d="M -16,-90 L 16,-90 L 12,-115 L -12,-115 Z" fill="url(#goldGrad)" />
      <path d="M 0,-115 L 0,-140" stroke="url(#goldGrad)" stroke-width="3" />
      <circle cx="0" cy="-143" r="4" fill="url(#goldGrad)" />
      <!-- Balcony -->
      <rect x="-18" y="-45" width="36" height="8" rx="2" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Typography Banner at bottom (Ahl al-Bayt & Karbala) -->
  <text x="256" y="415" text-anchor="middle" fill="url(#goldGrad)" font-family="serif" font-weight="bold" font-size="28" letter-spacing="2">
    كربلاء المقدسة
  </text>
  <text x="256" y="445" text-anchor="middle" fill="#a8a29e" font-family="sans-serif" font-weight="600" font-size="14" letter-spacing="1">
    KNOW ABOUT SHIA • APP
  </text>
</svg>
